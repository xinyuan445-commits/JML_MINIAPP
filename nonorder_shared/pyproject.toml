[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jml-nonorder"
version = "0.2.4"
requires-python = ">=3.10"
dependencies = ["SQLAlchemy>=2.0,<3", "Flask>=2.2,<4", "mysql-connector-python>=8", "python-dotenv>=1"]

[tool.setuptools.packages.find]
include = ["nonorder_core*"]
